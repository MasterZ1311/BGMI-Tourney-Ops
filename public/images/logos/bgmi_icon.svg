<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Tactical chamfered shield -->
  <path d="M8 2 L40 2 L46 8 L46 40 L40 46 L8 46 L2 40 L2 8 Z" fill="#121212" stroke="#ffb60e" stroke-width="2.5"/>
  <path d="M11 6 L37 6 L42 11 L42 37 L37 42 L11 42 L6 37 L6 11 Z" fill="#1c1c1c"/>
  
  <!-- Corner tactical accents -->
  <polygon points="8,2 14,2 8,8" fill="#ffb60e"/>
  <polygon points="40,2 34,2 40,8" fill="#ffb60e"/>
  <polygon points="8,46 14,46 8,40" fill="#ffb60e"/>
  <polygon points="40,46 34,46 40,40" fill="#ffb60e"/>

  <!-- Tactical Reticle / Crosshair -->
  <circle cx="24" cy="24" r="11" stroke="#ffb60e" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
  <circle cx="24" cy="24" r="3.5" fill="#ffb60e"/>
  
  <!-- Reticle Spikes -->
  <line x1="24" y1="8" x2="24" y2="15" stroke="#ffb60e" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="33" x2="24" y2="40" stroke="#ffb60e" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="15" y2="24" stroke="#ffb60e" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="24" x2="40" y2="24" stroke="#ffb60e" stroke-width="2" stroke-linecap="round"/>

  <!-- Level 3 Visor / Tactical Chevron Accent -->
  <path d="M19 20 L24 16 L29 20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
